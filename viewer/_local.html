<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FRENZO · 3D Viewer</title>
<style>
  html,body{margin:0;height:100%;background:#06070a;overflow:hidden;
    font-family:-apple-system,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8edf6}
  canvas{display:block;touch-action:none}
  .hud{position:fixed;left:0;right:0;bottom:16px;text-align:center;
    font:11px ui-monospace,Menlo,monospace;color:#5f6a7c;pointer-events:none}
  .tip{position:fixed;top:16px;left:0;right:0;text-align:center;
    font:12px ui-monospace,Menlo,monospace;color:#6f7a8c;pointer-events:none;
    transition:opacity .6s}
  .load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#06070a;z-index:10;transition:opacity .4s}
  .load.off{opacity:0;pointer-events:none}
  .ring{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.10);
    border-top-color:#7c5cff;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .lt{margin-top:16px;font:12px ui-monospace,Menlo,monospace;color:#6f7a8c}
  .err{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:32px;text-align:center;background:#06070a;z-index:11}
  .err .t{font-size:15px;font-weight:600;margin-bottom:8px}
  .err .d{font:12px ui-monospace,Menlo,monospace;color:#8b94a6;line-height:1.7;max-width:520px;word-break:break-all}
</style>
</head>
<body>
<div class="load" id="load">
  <div class="ring"></div>
  <div class="lt" id="lt">初始化…</div>
</div>
<div class="err" id="err">
  <div class="t">无法加载 3D</div>
  <div class="d" id="errd"></div>
</div>
<div class="tip" id="tip" style="opacity:0">拖动旋转 · 松手自动转</div>
<div class="hud" id="hud"></div>

<script src="../vendor/model3d.js"></script>
<script>
(function () {
  var load = document.getElementById('load'),
      lt = document.getElementById('lt'),
      err = document.getElementById('err'),
      errd = document.getElementById('errd'),
      tip = document.getElementById('tip'),
      hud = document.getElementById('hud');

  function fail(msg) {
    load.classList.add('off');
    err.style.display = 'flex';
    errd.textContent = msg;
  }

  var B = window.__FRENZO_3D__;
  if (!B) return fail('渲染库未加载（vendor/model3d.js 可能 404）');

  var THREE = B.THREE;

  // WebGL 检测
  try {
    var c = document.createElement('canvas');
    var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) throw new Error('no webgl');
  } catch (e) {
    return fail('当前浏览器不支持 WebGL。\n请用 Chrome / Safari / Edge 最新版打开。');
  }

  lt.textContent = '启动渲染器…';

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
  } catch (e) {
    return fail('WebGL 初始化失败: ' + e.message);
  }
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.setClearColor(0x06070a, 1);
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color('#06070a');

  lt.textContent = '生成环境光照…';
  var pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  scene.environment = pmrem.fromScene(new B.RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.95;

  var camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 200);

  var key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(2.4, 3.4, 2.8);
  var rim = new THREE.DirectionalLight(0x7ad9ff, 2.8); rim.position.set(-3.2, 1.8, -2.4);
  var fill = new THREE.DirectionalLight(0xc0aaff, 1.0); fill.position.set(-1.4, -1.2, 2.6);
  scene.add(key, rim, fill);

  var disc = new THREE.Mesh(
    new THREE.CircleGeometry(1, 64),
    new THREE.MeshBasicMaterial({ color: 0x1a2030, transparent: true, opacity: 0.5 })
  );
  disc.rotation.x = -Math.PI / 2;
  scene.add(disc);

  var loader = new B.GLTFLoader();
  loader.setMeshoptDecoder(B.MeshoptDecoder);

  lt.textContent = '加载模型…';

  loader.load(
    '../assets/mech-final.glb',
    function (gltf) {
      var root = gltf.scene;
      var group = new THREE.Group();
      group.add(root);
      scene.add(group);

      var box = new THREE.Box3().setFromObject(root);
      var size = box.getSize(new THREE.Vector3());
      if (size.z > size.y * 1.3) root.rotation.x = -Math.PI / 2;

      var ctr = new THREE.Box3().setFromObject(root).getCenter(new THREE.Vector3());
      root.position.sub(ctr);
      box = new THREE.Box3().setFromObject(root);
      root.position.y -= box.min.y;
      box = new THREE.Box3().setFromObject(root);
      size = box.getSize(new THREE.Vector3());

      var h = size.y;
      camera.position.set(0, h * 0.58, h * 2.15);
      camera.lookAt(0, h * 0.52, 0);

      disc.position.y = 0.001;
      disc.scale.setScalar(Math.max(size.x, size.z) * 1.6);

      var rotY = 0.45, drag = false, lastX = 0, vel = 0.0035;
      var el = renderer.domElement;

      el.addEventListener('pointerdown', function (e) { drag = true; lastX = e.clientX; tip.style.opacity = 0; });
      el.addEventListener('touchstart', function (e) { drag = true; lastX = e.touches[0].clientX; tip.style.opacity = 0; }, { passive: true });
      addEventListener('pointerup', function () { drag = false; });
      addEventListener('touchend', function () { drag = false; });
      addEventListener('pointermove', function (e) {
        if (!drag) return;
        var d = (e.clientX - lastX) * 0.01;
        rotY += d; vel = d * 0.35; lastX = e.clientX;
      });
      addEventListener('touchmove', function (e) {
        if (!drag) return;
        var d = (e.touches[0].clientX - lastX) * 0.01;
        rotY += d; vel = d * 0.35; lastX = e.touches[0].clientX;
      }, { passive: true });

      function tick() {
        if (!drag) { rotY += vel + 0.0022; vel *= 0.96; }
        group.rotation.y = rotY;
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      tick();

      addEventListener('resize', function () {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      load.classList.add('off');
      setTimeout(function () { tip.style.opacity = 1; }, 400);
      setTimeout(function () { tip.style.opacity = 0; }, 4200);
      hud.textContent = renderer.info.render.triangles.toLocaleString() + ' tri · WebGL';
      window.__ready = true;
      document.title = 'READY';
    },
    function (p) {
      if (p.total) lt.textContent = '加载模型 ' + Math.round((p.loaded / p.total) * 100) + '%';
      else lt.textContent = '加载模型 ' + (p.loaded / 1024 / 1024).toFixed(1) + ' MB';
    },
    function (e) {
      fail('模型加载失败：' + (e && (e.message || e.type) || e));
    }
  );
})();
</script>
</body>
</html>
