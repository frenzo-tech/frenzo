<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FRENZO · 3D Viewer</title>
<style>
  html,body{margin:0;height:100%;background:#06070a;overflow:hidden;
    font-family:-apple-system,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8edf6}
  canvas{display:block;touch-action:none}
  .load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#06070a;z-index:10;transition:opacity .4s}
  .load.off{opacity:0;pointer-events:none}
  .ring{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.10);
    border-top-color:#7c5cff;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .lt{margin-top:16px;font:12px ui-monospace,Menlo,monospace;color:#6f7a8c}
  .err{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:32px;text-align:center;background:#06070a;z-index:11}
  .err .t{font-size:15px;font-weight:600;margin-bottom:8px}
  .err .d{font:12px ui-monospace,Menlo,monospace;color:#8b94a6;line-height:1.7;max-width:520px;word-break:break-all}
  .card{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:rgba(10,13,20,.86);border:1px solid rgba(255,255,255,.12);border-radius:14px;
    padding:14px 20px;backdrop-filter:blur(8px);text-align:center;min-width:280px;
    opacity:0;transition:opacity .5s}
  .card.on{opacity:1}
  .nm{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .nm small{font-size:13px;color:#8b94a6;font-weight:600;margin-left:4px}
  .id{font:11px ui-monospace,Menlo,monospace;color:#6f7a8c;margin-top:3px}
  .chips{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .chip{font:9.5px ui-monospace,Menlo,monospace;color:#8b94a6;border:1px solid rgba(255,255,255,.10);
    background:rgba(255,255,255,.035);border-radius:7px;padding:5px 9px}
  .chip b{color:#e8edf6;font-weight:600}
  .hud{position:fixed;left:12px;bottom:10px;font:10px ui-monospace,Menlo,monospace;color:#3f4757;pointer-events:none}
</style>
</head>
<body>
<div class="load" id="load"><div class="ring"></div><div class="lt" id="lt">初始化…</div></div>
<div class="err" id="err"><div class="t">无法加载 3D</div><div class="d" id="errd"></div></div>
<div class="card" id="card">
  <div class="nm" id="nm">—</div>
  <div class="id" id="idn"></div>
  <div class="chips" id="chips"></div>
</div>
<div class="hud" id="hud"></div>

<script src="../vendor/model3d.js"></script>
<script src="../vendor/bnb-emblem.js"></script>
<script>
(function () {
  var load = document.getElementById('load'), lt = document.getElementById('lt'),
      err = document.getElementById('err'), errd = document.getElementById('errd'),
      card = document.getElementById('card'), nm = document.getElementById('nm'),
      idn = document.getElementById('idn'), chips = document.getElementById('chips'),
      hud = document.getElementById('hud');

  function fail(msg) { load.classList.add('off'); err.style.display = 'flex'; errd.textContent = msg; }

  var B = window.__FRENZO_3D__;
  if (!B) return fail('渲染库未加载（vendor/model3d.js 可能 404）');
  var THREE = B.THREE;
  if (window.FRENZO_BNB) window.FRENZO_BNB.init(THREE);

  try {
    var tc = document.createElement('canvas');
    // three.js r160+ 强制使用 webgl2
    if (!tc.getContext('webgl2')) throw new Error('no webgl2');
  } catch (e) {
    return fail('当前浏览器不支持 WebGL 2。\n请升级到 Chrome 60+ / Safari 15+ / Edge 79+ 再试。\n（微信内置浏览器通常不支持）');
  }

  var qs = new URLSearchParams(location.search);
  var tokenId = parseInt(qs.get('id') || '0', 10);

  var SKIN_HEX = { Fair:'#e3e8f0', Light:'#c8cfdb', Tan:'#c9a882', Deep:'#5d6675' };
  var ACC_HEX  = { Violet:'#8b6dff', Teal:'#1ec8b4', Coral:'#ff7a7a', Amber:'#ffab2e', Azure:'#4f8ef7', Orchid:'#c06bff' };

  function hexToStr(hex) {
    hex = hex.replace(/^0x/, '');
    var len = parseInt(hex.slice(64, 128), 16);
    var body = hex.slice(128, 128 + len * 2);
    var bytes = [];
    for (var i = 0; i < body.length; i += 2) bytes.push(parseInt(body.substr(i, 2), 16));
    var out;
    try { out = decodeURIComponent(escape(String.fromCharCode.apply(null, bytes))); }
    catch (e) { out = String.fromCharCode.apply(null, bytes); }
    return out;
  }

  function readTraits() {
    if (!tokenId) return Promise.reject(new Error('no-id'));
    return fetch('../nft/chain.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (cfg) {
        var data = '0xc87b56dd' + tokenId.toString(16).padStart(64, '0');
        return fetch(cfg.rpc, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_call', params: [{ to: cfg.nft, data: data }, 'latest'] })
        });
      })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.result || j.result === '0x') throw new Error('tokenURI 返回空');
        var uri = hexToStr(j.result);
        var b64 = uri.split(',')[1];
        var json = JSON.parse(decodeURIComponent(escape(atob(b64))));
        var t = {};
        (json.attributes || []).forEach(function (a) { t[a.trait_type] = a.value; });
        return {
          handle: (json.name || '').replace(/\.ai.*$/, '') || ('#' + tokenId),
          gender: t.Gender || 'Male',
          skin: t.Skin || 'Light',
          hair: t.Hair || 'Rose',
          outfit: t.Outfit || 'Violet',
          acc: t.Accessory || 'Visor'
        };
      });
  }

  lt.textContent = '启动渲染器…';
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.setClearColor(0x06070a, 1);
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color('#06070a');
  lt.textContent = '生成环境光照…';
  var pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  scene.environment = pmrem.fromScene(new B.RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.95;

  var camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 200);
  var key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(2.4, 3.4, 2.8);
  var rim = new THREE.DirectionalLight(0x7ad9ff, 2.8); rim.position.set(-3.2, 1.8, -2.4);
  var fill = new THREE.DirectionalLight(0xc0aaff, 1.0); fill.position.set(-1.4, -1.2, 2.6);
  scene.add(key, rim, fill);

  var disc = new THREE.Mesh(new THREE.CircleGeometry(1, 64),
    new THREE.MeshBasicMaterial({ color: 0x1a2030, transparent: true, opacity: 0.5 }));
  disc.rotation.x = -Math.PI / 2;
  scene.add(disc);

  var loader = new B.GLTFLoader();
  loader.setMeshoptDecoder(B.MeshoptDecoder);
  lt.textContent = '加载模型…';

  Promise.all([
    new Promise(function (res, rej) {
      loader.load('../nft/model/base.glb', res, function (p) {
        if (p.total) lt.textContent = '加载模型 ' + Math.round(p.loaded / p.total * 100) + '%';
      }, rej);
    }),
    readTraits().catch(function () {
      return { handle: 'demo', gender: 'Male', skin: 'Light', hair: 'Rose', outfit: 'Violet', acc: 'Visor' };
    })
  ]).then(function (out) {
    var gltf = out[0], tr = out[1];
    var root = gltf.scene, group = new THREE.Group();
    group.add(root);
    scene.add(group);

    var box = new THREE.Box3().setFromObject(root);
    var size = box.getSize(new THREE.Vector3());
    if (size.z > size.y * 1.3) root.rotation.x = -Math.PI / 2;
    var ctr = new THREE.Box3().setFromObject(root).getCenter(new THREE.Vector3());
    root.position.sub(ctr);
    box = new THREE.Box3().setFromObject(root);
    root.position.y -= box.min.y;
    box = new THREE.Box3().setFromObject(root);
    size = box.getSize(new THREE.Vector3());

    var h = size.y;
    camera.position.set(0, h * 0.58, h * 2.15);
    camera.lookAt(0, h * 0.52, 0);
    disc.position.y = 0.001;
    disc.scale.setScalar(Math.max(size.x, size.z) * 1.6);

    // ═ BNB 标志：胸章人人都有；眼镜跟随 Accessory ═
    if (window.FRENZO_BNB) {
      group.add(window.FRENZO_BNB.chest(h, 1));
      if (tr.acc === 'Glasses') group.add(window.FRENZO_BNB.glasses(h, 1));
    }

    var texName = (tr.skin || 'Light').toLowerCase() + '_' + (tr.outfit || 'Violet').toLowerCase();
    lt.textContent = '加载配色 ' + texName + '…';

    new THREE.TextureLoader().load('../nft/tex/' + texName + '.webp', function (t) {
      t.colorSpace = THREE.SRGBColorSpace;
      t.flipY = false;
      t.needsUpdate = true;
      root.traverse(function (o) {
        if (o.isMesh && o.material) { o.material.map = t; o.material.needsUpdate = true; }
      });
      finish();
    }, undefined, function () { finish(); });

    function finish() {
      var rotY = 0.45, drag = false, lastX = 0, vel = 0.0035;
      var el = renderer.domElement;
      el.addEventListener('pointerdown', function (e) { drag = true; lastX = e.clientX; });
      el.addEventListener('touchstart', function (e) { drag = true; lastX = e.touches[0].clientX; }, { passive: true });
      addEventListener('pointerup', function () { drag = false; });
      addEventListener('touchend', function () { drag = false; });
      addEventListener('pointermove', function (e) {
        if (!drag) return;
        var d = (e.clientX - lastX) * 0.01; rotY += d; vel = d * 0.35; lastX = e.clientX;
      });
      addEventListener('touchmove', function (e) {
        if (!drag) return;
        var d = (e.touches[0].clientX - lastX) * 0.01; rotY += d; vel = d * 0.35; lastX = e.touches[0].clientX;
      }, { passive: true });

      // 供截图/录屏使用：暂停自动旋转并设定角度
      var __paused = false;
      window.__setRot = function (rad) { __paused = true; rotY = rad; group.rotation.y = rad; renderer.render(scene, camera); };
      window.__resume = function () { __paused = false; };
      window.__ready3d = true;

      (function tick() {
        if (!__paused) {
          if (!drag) { rotY += vel + 0.0022; vel *= 0.96; }
          group.rotation.y = rotY;
          renderer.render(scene, camera);
        }
        requestAnimationFrame(tick);
      })();

      addEventListener('resize', function () {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      nm.textContent = String(tr.handle).slice(0, 40);
      var sm = document.createElement('small');
      sm.textContent = '.ai';
      nm.appendChild(sm);
      idn.textContent = (tokenId ? ('MINER #' + tokenId + ' · BSC') : 'DEMO');
      chips.innerHTML = [
        ['GENDER', tr.gender, ''],
        ['SKIN', tr.skin, SKIN_HEX[tr.skin] || '#888'],
        ['HAIR', tr.hair, ''],
        ['OUTFIT', tr.outfit, ACC_HEX[tr.outfit] || '#888'],
        ['ACCESSORY', tr.acc, '']
      ].map(function (c) {
        var dot = c[2] ? '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:' + c[2] + ';margin-right:5px;vertical-align:middle"></span>' : '';
        return '<span class="chip">' + c[0] + ' <b>' + dot + String(c[1]).replace(/[&<>"']/g, function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];}) + '</b></span>';
      }).join('');

      load.classList.add('off');
      card.classList.add('on');
      hud.textContent = renderer.info.render.triangles.toLocaleString() + ' tri · ' + texName;
      window.__ready = true;
      document.title = 'READY';
    }
  }).catch(function (e) { fail('加载失败：' + (e && (e.message || e))); });
})();
</script>
</body>
</html>
